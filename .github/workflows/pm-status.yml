# Weekly PM status — runs the inline five-scout sweep of the pm-status graph
# every Monday and files the report as a GitHub issue, which notifies the
# author by email. Report-only: this job never commits, pushes, or merges.
# (The full fleet graph with its skeptic panel is interactive-only via /pm —
# the Workflow tool backgrounds its fleet, which a one-shot CI job cannot
# outlive; see run #8.)
#
# Auth: the CLAUDE_CODE_OAUTH_TOKEN repository secret — a Claude subscription
# token from `claude setup-token`. (To use API billing instead: add credits at
# console.anthropic.com and re-enable the anthropic_api_key input below.)
#
# Delivery: Claude writes the report to /tmp/pm-report.md; a plain follow-up
# step files it as an issue with the runner's own token — the delivery edge is
# code, not an agent action, so it cannot be blocked by permission prompts.
#
# Schedule is UTC: 16:00 Monday = 9:00 AM Pacific during daylight time
# (8:00 AM in winter). Manual runs: Actions tab → this workflow → Run workflow.

name: Weekly PM status

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action exchanges an OIDC token for its GitHub credentials

jobs:
  pm-status:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the pm-status graph
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Auth: the subscription token (from `claude setup-token`). The
          # ANTHROPIC_API_KEY line is disabled — the stored key has no API
          # credits, and when both are offered the action prefers the key and
          # fails with "Credit balance is too low". To switch to API billing
          # later: add credits at console.anthropic.com, then re-enable it.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }} # use the runner's token directly; job only needs issues: write
          prompt: |
            You are running the weekly project-status pulse for the EXSTO ERGO
            SUM academic-submission repository. This prompt is the author's
            explicit request to run the pm-status workflow graph.

            1. Perform the five scout sweeps of the pm-status graph as
               parallel subagents (repository state; version/count drift
               across README.md and derived/*.txt; verification debt in
               VERIFICATION.md; submission readiness across the cover letter
               and both title pages; .claude tooling health), re-verify any
               high-severity finding yourself against the cited files, and
               synthesize the report in PM-STATUS.md's structure, labeled
               "inline run". Do NOT use the Workflow tool here: it launches
               its fleet in the background and returns immediately, and in
               this one-shot headless job, ending your turn kills the runner
               before the fleet finishes — the report would be lost. The full
               graph with its skeptic panel is for interactive /pm sessions.
            2. Compare the outcome with the previous report in PM-STATUS.md at
               the repository root: open with one line stating what changed —
               new findings, resolved findings, or "unchanged".
            3. Write the complete dated report to /tmp/pm-report.md with the
               Write tool — that path is outside the repository, so the run
               stays report-only. First line: "# PM status — <today's date>".
               Keep the report complete, confirmed high-severity findings
               first. A follow-up workflow step files that file as the GitHub
               issue — do NOT run gh yourself. Also include the full report
               in your final message.
            4. End the report with a "Pipeline retrospective" section: one
               short paragraph on what this run's own process missed, wasted,
               or got wrong (a scout that added no signal, a check that
               should exist, a false positive pattern), and AT MOST ONE
               concrete proposed change to this routine's prompt or workflow
               file — phrased as a suggestion for the author to approve.
               Never apply such a change yourself; reflection here, decision
               with the author.
            5. Report-only, like the graph itself: change no repository files,
               commit nothing, push nothing, merge nothing, open no pull
               requests.

            Preserve Sanskrit diacritics exactly in everything you write:
            Ahiṃsā, Saṃskāra-Vyākaraṇa, Sat-Cit-Ānanda, Pañca-Stambha.
          # Pin a standard model: the CI default resolved to an opus 1M-context
          # beta variant that a plain API key may not be entitled to, and a
          # weekly ~30-agent fleet belongs on the economical tier regardless.
          #
          # --dangerously-skip-permissions: this is a headless, sandboxed CI
          # runner — no one exists to answer permission prompts, and without
          # it the Workflow tool and Bash are denied (run #7 fell back to the
          # inline sweep and could not use git/gh at all). Blast radius is
          # bounded by the job permissions above: contents read-only, issues
          # write, nothing else.
          claude_args: "--max-turns 150 --model claude-sonnet-5 --dangerously-skip-permissions"
          # Surface Claude's output in the job log so API-level errors
          # (credits, model access) are visible instead of hidden.
          show_full_output: "true"

      - name: File the report as a GitHub issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/pm-report.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "PM status — $(date -u +%Y-%m-%d)" \
              --body-file /tmp/pm-report.md
          else
            echo "::warning::No /tmp/pm-report.md produced — the report exists only in this run's log"
          fi

      # When the Claude step fails, its real error (expired/revoked token,
      # usage limit, model access) is buried in the job log. Pull the final
      # result message out of the execution file and file it as an issue so
      # the failure email carries the actual reason.
      - name: Report the Claude failure reason
        if: failure() && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          reason="(no execution file produced)"
          if [ -n "$EXEC_FILE" ] && [ -s "$EXEC_FILE" ]; then
            reason=$(jq -r '[.[] | select(.type == "result")] | last | .result // "(result message had no text)"' "$EXEC_FILE" 2>/dev/null || tail -c 2000 "$EXEC_FILE")
          fi
          echo "::error title=Claude failure reason::$reason"
          {
            echo "The weekly PM status run failed before producing a report."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            echo "$reason"
            echo '```'
          } > /tmp/failure.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "PM status run failed — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/failure.md
